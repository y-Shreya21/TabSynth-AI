# TabSynth AI - Master Synthetic Data Generation Configuration

generation:
  num_samples: 1000
  batch_size: 256
  device: "auto"

guidance:
  cfg_scale: 1.0  # 0.0 for standard conditional, >0.0 for Classifier-Free Guidance extrapolation

conditioning:
  strategy: "balanced"  # Options: 'balanced', 'natural', 'class_specific', 'unconditional'
  specific_class: 0     # Used only when strategy is 'class_specific'

sampling:
  clip_denoised: true
  temperature: 1.0

output:
  format: "csv"
  save_dir: "data/synthetic/"
