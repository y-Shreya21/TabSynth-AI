version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tabsynth-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TABSYNTH_ENV=production
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./experiments/results:/app/experiments/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["uvicorn", "api.server:app", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tabsynth-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - TABSYNTH_API_URL=http://api:8000
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./experiments/results:/app/experiments/results
    depends_on:
      api:
        condition: service_healthy
    command: ["streamlit", "run", "app/main.py", "--server.port=8501", "--server.address=0.0.0.0"]
