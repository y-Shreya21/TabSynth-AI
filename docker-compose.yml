version: "3.8"

services:
  # FastAPI REST Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tabsynth-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TABSYNTH_DATA_DIR=/app/data
      - TABSYNTH_CHECKPOINT_DIR=/app/checkpoints
      - TABSYNTH_EXPERIMENT_DIR=/app/experiments/results
      - TABSYNTH_DB_PATH=/app/data/tabsynth.db
      - TABSYNTH_DEVICE=cpu
      - MAX_CONCURRENT_JOBS=1
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./experiments/results:/app/experiments/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Streamlit Interactive Analytics Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tabsynth-dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "app/main.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - TABSYNTH_API_URL=http://api:8000
      - TABSYNTH_DATA_DIR=/app/data
      - TABSYNTH_CHECKPOINT_DIR=/app/checkpoints
      - TABSYNTH_EXPERIMENT_DIR=/app/experiments/results
      - TABSYNTH_DB_PATH=/app/data/tabsynth.db
      - TABSYNTH_DEVICE=cpu
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./experiments/results:/app/experiments/results
    depends_on:
      api:
        condition: service_healthy
