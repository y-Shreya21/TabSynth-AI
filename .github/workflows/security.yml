name: TabSynth AI Security & Secret Scanning

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  security-audit:
    name: Code & Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Secret & Credential Scanning
        run: |
          python scripts/security_audit.py --check-secrets

      - name: Data Privacy & Artifact Tracking Audit
        run: |
          python scripts/security_audit.py --check-privacy
