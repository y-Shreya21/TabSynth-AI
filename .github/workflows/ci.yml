name: TabSynth AI Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit, Integration & Smoke Benchmarks (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[full]"

      - name: Syntax & Compilation Verification
        run: |
          python -m py_compile $(find src scripts api app tests -name "*.py")

      - name: Configuration & Sanity Check
        run: |
          python -c "from api.config import settings; settings.validate_production_config(); print('Config Validated')"

      - name: Run Phase 05 Evaluation Smoke Test
        run: |
          python scripts/run_phase05_smoke.py

      - name: Run Phase 06 Application Smoke Test
        run: |
          python scripts/run_phase06_smoke.py

      - name: Run Phase 07 Production Hardening Smoke Test
        run: |
          python scripts/run_phase07_smoke.py

      - name: Run Full Pytest Test Suite
        run: |
          pytest tests/ -v --cov=tabsynth --cov-report=term-missing

  docker-build:
    name: Multi-Stage Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tabsynth-ai:test
          load: true

      - name: Verify Container Image Integrity
        run: |
          docker run --rm tabsynth-ai:test python -c "import tabsynth; import api; print('Container runtime verified successfully!')"
