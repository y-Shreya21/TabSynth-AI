name: TabSynth AI Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[full]"

      - name: Syntax & Compilation Verification
        run: |
          python -m py_compile $(find src scripts api app tests -name "*.py")

      - name: Run Smoke Benchmark
        run: |
          python scripts/run_phase05_smoke.py

      - name: Run Test Suite
        run: |
          pytest tests/ -v --cov=tabsynth --cov-report=term-missing
